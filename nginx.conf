events {
  worker_connections 1024;
}

http {
  # Docker's embedded DNS server. Resolving "api" through this, instead of
  # a static `upstream {}` block, is what lets nginx pick up new/removed
  # replicas after you run `docker compose up --scale api=N` — a static
  # upstream block only resolves the hostname once, at nginx startup, and
  # never notices the container set changed.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Match the app's own upload limit (MAX_UPLOAD_MB, default 20 in
  # backend/.env.example) with a little headroom, so nginx isn't the one
  # rejecting uploads the app itself would accept.
  client_max_body_size 25m;

  server {
    listen 80;
    # Everything on plain HTTP just redirects to HTTPS. $host drops
    # whatever port the client connected on, so this always lands on the
    # standard 443 port below, regardless of which host port maps to :80.
    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;

    ssl_certificate     /etc/nginx/certs/dev-cert.pem;
    ssl_certificate_key /etc/nginx/certs/dev-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
      set $upstream api:4000;
      proxy_pass http://$upstream;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Long-ish timeouts: OCR extraction (services/extraction.js) can run
      # for tens of seconds on a large image, and that request needs to
      # survive sitting behind this proxy the whole time.
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }
  }
}
