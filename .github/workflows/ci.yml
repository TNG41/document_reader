name: CI/CD

# Mirrors the Dev -> SIT -> Prod environment chain:
#   - every PR into develop/main runs lint + test (this is the "SIT" gate —
#     nothing merges without the automated checks passing)
#   - a push to main additionally builds and publishes the Docker image
#     that staging/production deploy from
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: document_reader_test
          POSTGRES_USER: doc_reader_app
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U doc_reader_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run migrations against test DB
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: document_reader_test
          PGUSER: doc_reader_app
          PGPASSWORD: test-only-password
        run: npm run migrate

      - name: Run tests
        env:
          NODE_ENV: test
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: document_reader_test
          PGUSER: doc_reader_app
          PGPASSWORD: test-only-password
          JWT_SECRET: ci-test-secret-not-used-anywhere-real
        run: npm test

  build-and-push:
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/document-reader-api:latest
            ghcr.io/${{ github.repository }}/document-reader-api:${{ github.sha }}

      # Deploy step is deliberately left as a placeholder: a real pipeline
      # would call out to the staging host / k8s cluster / ECS service here,
      # using secrets stored in the repo's Environments (SIT, UAT, Production)
      # rather than in this file.
      - name: Deploy to staging (placeholder)
        run: echo "Trigger staging deploy via SSH, kubectl, or your platform's CLI here"
