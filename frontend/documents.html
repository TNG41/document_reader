<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>สารบัญ — เอกสาร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&family=Prompt:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◧</span>
      <span class="brand-name">สารบัญ</span>
    </div>
    <button class="nav-toggle" id="navToggle" type="button" aria-label="Toggle menu" aria-expanded="false" data-authed-only hidden>☰</button>
    <nav class="nav" id="siteNav" data-authed-only hidden>
      <a class="nav-link" href="index.html">upload</a>
      <a class="nav-link active" href="documents.html">documents</a>
      <a class="nav-link" href="admin.html" id="navAdminLink" hidden>admin panel</a>
    </nav>
    <div class="topbar-user" id="topbarUser" hidden>
      <span class="role-badge" id="roleBadge">user</span>
      <span class="user-email-wrap">
        <span class="user-email" id="userEmail"></span>
        <button class="change-password-trigger" id="changePasswordTrigger" type="button" title="Change password" aria-label="Change password">✎</button>
      </span>
      <button class="btn-ghost" id="logoutBtn" type="button">log out</button>
    </div>
  </header>

  <main class="stage stage-wide">
    <div class="layout" data-authed-only hidden>
      <aside class="sidebar">
        <section class="docs" id="docsSection">
          <div class="docs-header">
            <p class="section-eyebrow">saved documents</p>
            <div class="docs-tabs">
              <a class="docs-tab" href="index.html">upload new</a>
              <button class="docs-tab" id="othersTabBtn" type="button" hidden>others</button>
            </div>
          </div>

          <button class="docs-breadcrumb" id="docsBreadcrumb" type="button" hidden>‹ back to users</button>

          <p class="docs-empty" id="docsEmpty" hidden>Nothing saved yet — upload a file from the reader page to see it here.</p>

          <div class="doc-list" id="docList"></div>
        </section>
      </aside>

      <main class="main-content">
        <section class="viewer viewer--sidebar" id="viewerSection" hidden>
          
          <div class="viewer-toolbar">
            <p class="section-eyebrow">viewing</p>
            <p class="viewer-filename" id="viewerFilename">—</p>
            <p class="viewer-uploader" id="viewerUploader"></p>
            <div class="viewer-actions">
              <a class="btn-ghost" id="downloadBtn" type="button">download</a>
              <button class="btn-ghost" id="closeViewerBtn" type="button">close</button>
            </div>
          </div>
          <div class="viewer-frame-wrap" id="viewerFrameWrap"></div>
        </section>
        <p class="docs-placeholder" id="docsPlaceholder">Select a document from the list to view it here.</p>
      </main>
    </div>

    <p class="error-banner" id="errorBanner" hidden></p>
  </main>

  <footer class="footer">
    <span>TNG41</span>
  </footer>

  <script src="shared.js"></script>
  <script src="documents.js"></script>
</body>
</html>
